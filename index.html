<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu blog tech</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background-color: #ffffff;
      color: #111111;
      font-family: "Times New Roman", Times, serif;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      background-color: #163d64;
      color: #ffffff;
      text-align: center;
      max-width: 800px;
      margin: 0 auto 24px auto;
      padding: 32px 24px;
      border: 4px solid #e53935;
      border-radius: 8px;
      box-sizing: border-box;
    }

    header h1 {
      margin: 0 0 18px 0;
      font-size: 36px;
      font-weight: bold;
      line-height: 1.2;
    }

    header p {
      margin: 0;
      font-size: 18px;
      line-height: 1.5;
    }

    .post-image {
      display: block;
      width: 80px;
      height: 80px;
      margin: 0 0 24px 0;
      object-fit: contain;
    }

    article h2 {
      margin: 0 0 16px 0;
      font-size: 24px;
      font-weight: bold;
    }

    article .autor {
      margin: 0 0 18px 0;
      font-size: 16px;
    }

    article .texto {
      margin: 0;
      font-size: 16px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Meu blog tech</h1>
      <p>Vou compartilhar conhecimentos sobre tecnologia e programação</p>
    </header>

    <main>
      <img
        class="post-image"
        src="muhehehehehhe.webp"
        alt="Imagem de livro aberto com lâmpada"
      >

      <article>
        <h2>Meu primeiro post</h2>
        <p class="autor">Por: Marcelo Paludetto</p>
        <p class="texto">Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.</p>
      </article>
    </main>
  </div>
</body>
</html>
